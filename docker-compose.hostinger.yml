services:
  postgres:
    image: postgres:16-alpine
    container_name: fortin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: fortin-api
    restart: unless-stopped
    env_file:
      - .env.hostinger
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3333
      FRONTEND_ORIGIN: https://${APP_DOMAIN}
      WHATSAPP_BOT_URL: http://chatbot:3001
    depends_on:
      postgres:
        condition: service_healthy
      chatbot:
        condition: service_started

  chatbot:
    build:
      context: ./chatbot-fortin
      dockerfile: Dockerfile
    container_name: fortin-chatbot
    restart: unless-stopped
    env_file:
      - .env.hostinger
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - chatbot_sessions:/app/sessions

  web:
    build:
      context: .
      dockerfile: deploy/hostinger/Dockerfile
      args:
        VITE_API_URL: https://${APP_DOMAIN}/api
        EXPO_PUBLIC_API_URL: https://${APP_DOMAIN}/api
    container_name: fortin-web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  chatbot_sessions:
  caddy_data:
  caddy_config:
