openapi: 3.0.3
info:
  title: Açaí do Fortin API
  version: 1.0.0
  description: API REST para delivery, fidelidade e administração do projeto Açaí do Fortin.
servers:
  - url: http://localhost:3333/api
tags:
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: Admin
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Cria uma nova conta de cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Conta criada com token JWT
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica cliente ou administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login realizado
  /categories:
    get:
      tags: [Catalog]
      summary: Lista categorias com produtos ativos
      responses:
        '200':
          description: Catálogo por categorias
  /products:
    get:
      tags: [Catalog]
      summary: Lista produtos ativos
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: featured
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista de produtos
  /coupons/validate:
    post:
      tags: [Orders]
      summary: Valida cupom de desconto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponValidationInput'
      responses:
        '200':
          description: Resultado da validação
  /orders:
    post:
      tags: [Orders]
      summary: Cria um pedido do cliente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Pedido criado
    get:
      tags: [Admin]
      summary: Lista pedidos para gestão administrativa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedidos consolidados
  /orders/me:
    get:
      tags: [Orders]
      summary: Histórico do cliente autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos do usuário
  /dashboard/summary:
    get:
      tags: [Admin]
      summary: Métricas do painel administrativo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados agregados do dashboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    CouponValidationInput:
      type: object
      required: [code, subtotal]
      properties:
        code:
          type: string
        subtotal:
          type: number
    OrderItemInput:
      type: object
      required: [productId, quantity, selectedSizeId]
      properties:
        productId:
          type: string
        quantity:
          type: integer
        selectedSizeId:
          type: string
        selectedAddOnIds:
          type: array
          items:
            type: string
        notes:
          type: string
    CreateOrderInput:
      type: object
      required: [paymentMethod, items]
      properties:
        addressId:
          type: string
        couponCode:
          type: string
        paymentMethod:
          type: string
          enum: [PIX, CARD, CASH]
        changeFor:
          type: number
        notes:
          type: string
        deliveryLat:
          type: number
        deliveryLng:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'

